spring:
  datasource:
    url: jdbc:h2:mem:finances;MODE=PostgreSQL;DATABASE_TO_UPPER=false;INIT=CREATE SCHEMA IF NOT EXISTS finances
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: FINANCES
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092

finances:
  currencies:
    supported: [ARS, USD]

INTERNAL_AUTH_TOKEN: test-token
