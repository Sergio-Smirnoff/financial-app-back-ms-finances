server:
  port: 8082
  forward-headers-strategy: framework

spring:
  application:
    name: finances-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/financialapp?currentSchema=finances}
    username: ${DB_USERNAME:financialapp}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: finances
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  flyway:
    schemas: finances
    default-schema: finances
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9093}
    consumer:
      group-id: ${spring.application.name}-group

messaging:
  outbox:
    poll-ms: ${OUTBOX_POLL_MS:2000}

finances:
  ownership:
    cache-ttl-ms: ${OWNERSHIP_CACHE_TTL_MS:60000}
  currencies:
    # Business policy: currencies this service accepts on NEW writes. Adding one is a YAML edit + restart.
    # Removing one is soft — existing rows keep reading; only new writes are rejected (spec §11).
    # Grep the transactions table before pruning a currency.
    supported: ${SUPPORTED_CURRENCIES:ARS,USD,EUR}

alerts:
  days-before-payment: ${DAYS_BEFORE_PAYMENT_ALERT:3}
  days-before-loan: ${DAYS_BEFORE_LOAN_ALERT:3}
  days-before-installment: ${DAYS_BEFORE_INSTALLMENT_ALERT:3}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
